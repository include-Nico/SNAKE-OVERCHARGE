<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SNAKE: OVERCHARGE</title>
<meta name="theme-color" content="#070716">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Overcharge">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#070716;color:#eaf0ff;font:600 16px "Trebuchet MS",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
body[data-s=menu] #home,body[data-s=shop] #shop,body[data-s=over] #over,body.paused #pz{display:flex}
#intro{position:fixed;inset:0;z-index:9;background:#070716;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}
.glass{background:rgba(18,18,56,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(140,160,255,.25);border-radius:20px;padding:18px}
h1{margin:0 0 8px;text-align:center;line-height:.92;font:900 italic clamp(50px,17vw,112px) "Arial Black","Trebuchet MS",sans-serif;color:#39ff9c;text-shadow:0 0 28px #39ff9c99}
h1 small{display:block;font-size:.5em;background:linear-gradient(90deg,#ffc83d,#ff3d81);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 12px #ff3d8199)}
h2{margin:0;font:900 italic 34px "Arial Black",sans-serif;color:#ff3d81;text-shadow:0 0 18px #ff3d8199}
.btn{font:inherit;font-weight:900;font-size:18px;color:#06120c;background:linear-gradient(135deg,#39ff9c,#3df0ff);border:0;border-radius:14px;padding:14px 26px;min-width:230px;box-shadow:0 0 26px #39ff9c55;cursor:pointer}
.btn.alt{background:rgba(255,255,255,.08);color:#eaf0ff;box-shadow:none;border:1px solid rgba(140,160,255,.3)}
.btn:active{transform:scale(.96)}
button:disabled{opacity:.35;pointer-events:none}
.big{font:900 64px "Arial Black",sans-serif;color:#ffc83d;text-shadow:0 0 22px #ffc83d88}
.muted{color:#9aa7d6;margin:0}
#hud{position:fixed;top:0;left:0;right:0;height:64px;padding:0 12px;display:none;align-items:center;gap:12px;pointer-events:none}
body[data-s=play] #hud{display:flex}
#sc{font:900 28px "Arial Black",sans-serif;color:#39ff9c;min-width:64px}
.bar{width:70px;height:10px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3df0ff,#39ff9c)}
#fx{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.1);border-radius:10px;padding:3px 8px;font-size:14px}
#pb{pointer-events:auto;width:42px;height:42px;border-radius:12px;border:1px solid rgba(140,160,255,.3);background:rgba(255,255,255,.08);color:#eaf0ff;font-size:16px}
#db{position:fixed;right:20px;bottom:26px;width:88px;height:88px;border-radius:50%;display:none;border:2px solid #3df0ff;background:rgba(61,240,255,.14);color:#3df0ff;font:900 15px "Trebuchet MS",sans-serif;box-shadow:0 0 22px #3df0ff55;touch-action:none}
body[data-s=play].touch #db{display:block}
#sh{width:min(92vw,460px);max-height:76vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;font:inherit;font-weight:800;padding:10px;border-radius:12px;border:1px solid rgba(140,160,255,.25);background:transparent;color:#9aa7d6}
.tabs button.on{background:#39ff9c;color:#06120c;border-color:#39ff9c}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(140,160,255,.15)}
.row b{display:block}.row small{display:block;color:#9aa7d6;font-weight:500}
.row button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px 14px;background:#ffc83d;color:#1a1200;min-width:84px}
.pips{color:#39ff9c;letter-spacing:2px;font-style:normal;font-size:12px}
.sw{display:inline-block;width:34px;height:12px;border-radius:6px;margin-right:8px}
.coins{font:900 22px "Arial Black",sans-serif;color:#ffc83d;text-align:center}
@media(prefers-reduced-motion:reduce){#intro{transition:none}}
</style>
</head>
<body>
<canvas id="g"></canvas>

<div id="hud">
  <div id="sc">0</div><div id="co">🪙 0</div>
  <div class="bar" title="Stamina Scatto"><i id="sta"></i></div>
  <div id="fx"></div><button id="pb" aria-label="Pausa">❚❚</button>
</div>
<button id="db">DASH</button>

<div class="scr" id="home">
  <h1>SNAKE<small>OVERCHARGE</small></h1>
  <p class="muted" id="st"></p>
  <button class="btn" id="play">Gioca</button>
  <button class="btn alt" id="lab">Laboratorio</button>
  <button class="btn alt" id="inst" hidden>Installa app</button>
</div>

<div class="scr" id="shop">
  <div class="glass" id="sh"><div id="sb"></div></div>
  <button class="btn alt" id="back">Indietro</button>
  <input type="file" id="fi" accept="application/json" hidden>
</div>

<div class="scr" id="over">
  <h2 id="ot"></h2><div class="big" id="os">0</div><p class="muted" id="oc"></p>
  <button class="btn" id="again">Riprova</button>
  <button class="btn alt" id="olab">Laboratorio</button>
  <button class="btn alt" id="ohome">Menu</button>
</div>

<div class="scr" id="pz" style="background:rgba(7,7,22,.75);z-index:5">
  <h2>Pausa</h2>
  <button class="btn" id="res">Riprendi</button>
  <button class="btn alt" id="quit">Menu</button>
</div>

<div id="intro"><canvas id="ic"></canvas></div>

<script>
const $=s=>document.querySelector(s),rand=n=>Math.floor(Math.random()*n),SK='snake-overcharge-v1';
const UP=[
 {id:'mag',n:'Batteria Magnetica',d:'+1s durata Magnete',max:5,c:l=>40+l*40},
 {id:'ghost',n:'Spettro Stabile',d:'+1s durata Spettro',max:5,c:l=>40+l*40},
 {id:'over',n:'Overclock Esteso',d:'+1s durata Overclock',max:5,c:l=>60+l*50},
 {id:'dash',n:'Efficienza Scatto',d:'Stamina che si ricarica più in fretta',max:5,c:l=>30+l*35},
 {id:'shield',n:'Frequenza Scudo',d:'+8% probabilità di Scudo',max:5,c:l=>50+l*45}];
const SKINS=[
 {id:'neon',n:'Neon Vector',cost:0,c1:'#39ff9c',c2:'#3df0ff',e:'#fff',p:['#39ff9c','#3df0ff']},
 {id:'pixel',n:'Hi-Bit Pixel Dragon',cost:150,c1:'#ff9d3d',c2:'#c2412d',e:'#ffe98a',p:['#ff9d3d','#ffd23d','#c2412d']},
 {id:'mecha',n:'Mecha Snake',cost:350,score:600,c1:'#9aa7c7',c2:'#4b5878',e:'#ff3d4d',p:['#9aa7c7','#ff3d4d','#fff']}];
const PW={mag:{e:'🧲',c:'#3d8bff'},ghost:{e:'👻',c:'#c89bff'},shield:{e:'🛡️',c:'#3df0ff'},cut:{e:'✂️',c:'#ff3d4d'},over:{e:'✨',c:'#ffc83d'}};
const def={coins:0,hi:0,time:0,games:0,up:{},skin:'neon',own:['neon'],snd:1};
let S;try{S={...def,...JSON.parse(localStorage.getItem(SK))}}catch(e){S={...def}}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}},lv=id=>S.up[id]||0,own=k=>S.own.includes(k.id)||(k.score&&S.hi>=k.score);

let ac;function snd(f,d=.08,t='square',v=.04){if(!S.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(1e-4,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

/* ---------- stato & layout ---------- */
let G=null,state='intro',paused=false,last=0,stab='up',W,H,DPR,cell=20,cols=18,rows=18,ox=0,oy=0;
const cv=$('#g'),c=cv.getContext('2d'),amb=Array.from({length:36},()=>({x:Math.random(),y:Math.random(),v:.01+Math.random()*.03,s:1+Math.random()*2}));
const setState=s=>{state=s;document.body.dataset.s=s};
function layout(){const top=64;let a=G?G.cols:0,b=G?G.rows:0;
 if(!a){cell=Math.max(14,Math.floor(Math.min(W,H-top)/18));a=cols=Math.floor(W/cell);b=rows=Math.floor((H-top)/cell)}
 else cell=Math.floor(Math.min(W/a,(H-top)/b));
 ox=Math.floor((W-a*cell)/2);oy=top+Math.floor((H-top-b*cell)/2)}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;layout()}
addEventListener('resize',resize);resize();
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');

/* ---------- gioco ---------- */
function newGame(){const x=cols>>1,y=rows>>1,g={cols,rows,snake:[{x,y},{x:x-1,y},{x:x-2,y}],dir:{x:1,y:0},q:[],items:[],fx:{mag:0,ghost:0,over:0,shield:0,inv:0},score:0,coins:0,stam:100,dash:0,acc:-600,t:0,pT:6000,cT:3000,alive:true,shake:0,freeze:0,eaten:0,grow:0,parts:[]};
 g.prev=g.snake.map(s=>({...s}));spawn(g,'food',1e9);return g}
function startGame(){G=null;layout();G=newGame();paused=false;document.body.classList.remove('paused');setState('play');snd(440,.1)}
function spawn(g,type,ttl){for(let i=0;i<200;i++){const x=rand(g.cols),y=rand(g.rows);if(!g.snake.some(s=>s.x==x&&s.y==y)&&!g.items.some(s=>s.x==x&&s.y==y)){g.items.push({type,x,y,ttl,max:ttl});return}}}
function burst(g,p,col,n,sp=4){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=sp*(.4+Math.random()),l=500+Math.random()*400;g.parts.push({x:p.x+.5,y:p.y+.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,c:col,s:cell*.2*(.5+Math.random())})}}
const tickMs=g=>Math.max(85,135-g.eaten*1.2)*(g.dash>0?.45:1);
function collect(g,it){const F=g.fx,m=F.over>0?2:1,h=g.snake[0];
 if(it.type=='food'){g.score+=10*m;g.grow++;g.eaten++;spawn(g,'food',1e9);burst(g,h,'#ff3d81',10);g.shake=Math.max(g.shake,3);snd(520,.07)}
 else if(it.type=='coin'){g.coins+=m;g.score+=5*m;burst(g,h,'#ffc83d',8);snd(880,.06,'triangle')}
 else{burst(g,h,PW[it.type].c,16,5);g.shake=Math.max(g.shake,5);snd(660,.18,'sawtooth');
  if(it.type=='shield')F.shield=1;
  else if(it.type=='cut'){const old=g.snake.length-1,keep=Math.max(3,Math.ceil(old/2));g.coins+=(old-keep)*m;g.snake.length=Math.min(g.snake.length,keep+1);g.grow=0}
  else F[it.type]=(5+lv(it.type))*1000}}
function die(g){g.rec=g.score>S.hi;g.alive=false;g.freeze=100;g.shake=22;S.coins+=g.coins;S.hi=Math.max(S.hi,g.score);S.games++;S.time+=g.t/1000;save();
 const p=SKINS.find(s=>s.id==S.skin).p;g.snake.forEach((s,i)=>burst(g,s,p[i%p.length],3,6));snd(90,.5,'sawtooth',.1);setTimeout(()=>showOver(g),750)}
function step(g){g.prev=g.snake.map(s=>({x:s.x,y:s.y}));if(g.q.length)g.dir=g.q.shift();
 const h=g.snake[0],F=g.fx;let nx=h.x+g.dir.x,ny=h.y+g.dir.y;
 const wall=nx<0||ny<0||nx>=g.cols||ny>=g.rows,body=g.snake.some((s,i)=>i<g.snake.length-1&&s.x==nx&&s.y==ny);
 if((wall||body)&&F.ghost<=0&&F.inv<=0){if(F.shield){F.shield=0;F.inv=1000;g.shake=12;snd(120,.2,'sawtooth')}else return die(g)}
 if(wall){nx=(nx+g.cols)%g.cols;ny=(ny+g.rows)%g.rows}
 g.snake.unshift({x:nx,y:ny});
 let k=g.items.findIndex(i=>i.x==nx&&i.y==ny);if(k>=0)collect(g,g.items.splice(k,1)[0]);
 if(F.mag>0){for(const it of g.items){const dx=nx-it.x,dy=ny-it.y;if(Math.hypot(dx,dy)<=3.2){if(Math.abs(dx)>=Math.abs(dy))it.x+=Math.sign(dx);else it.y+=Math.sign(dy)}}
  while((k=g.items.findIndex(i=>i.x==nx&&i.y==ny))>=0)collect(g,g.items.splice(k,1)[0])}
 if(g.grow>0)g.grow--;else g.snake.pop()}
function update(g,dt){g.t+=dt;const F=g.fx;for(const k of['mag','ghost','over','inv'])F[k]=Math.max(0,F[k]-dt);
 g.dash=Math.max(0,g.dash-dt);g.stam=Math.min(100,g.stam+dt*(12+6*lv('dash'))/1000);
 if((g.pT-=dt)<=0){g.pT=7000+rand(4000);const t=Math.random()<.15+.08*lv('shield')?'shield':['mag','ghost','cut','over'][rand(4)];spawn(g,t,8000)}
 if((g.cT-=dt)<=0){g.cT=2500+rand(2500);if(g.items.filter(i=>i.type=='coin').length<3)spawn(g,'coin',10000)}
 for(const it of g.items)if(it.type!='food')it.ttl-=dt;g.items=g.items.filter(i=>i.ttl>0);
 if(F.over>0&&Math.random()<.3)burst(g,{x:rand(g.cols),y:rand(g.rows)},'#ffc83d',1,1);
 g.acc+=dt;let tk=tickMs(g);while(g.acc>=tk&&g.alive){g.acc-=tk;step(g);tk=tickMs(g)}}
function dash(){const g=G;if(state!='play'||paused||!g||!g.alive||g.dash>0)return;
 if(g.stam>=40)g.stam-=40;else if(g.snake.length>4)g.snake.pop();else return;g.dash=500;g.shake=Math.max(g.shake,4);snd(300,.15,'sawtooth')}
function setDir(x,y){const g=G;if(state!='play'||paused||!g||!g.alive)return;const l=g.q.length?g.q[g.q.length-1]:g.dir;
 if((l.x==-x&&l.y==-y)||(l.x==x&&l.y==y)||g.q.length>=2)return;g.q.push({x,y})}
function pause(on){if(state!='play'||!G||!G.alive)return;paused=on;document.body.classList.toggle('paused',on)}

/* ---------- input ---------- */
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
 if(m){setDir(...m);e.preventDefault()}else if(k==' '){dash();e.preventDefault()}else if(k=='p'||k=='escape')pause(!paused)});
let tx,ty,tt=0,moved=false,lastTap=0;
cv.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length>1)return dash();tx=e.touches[0].clientX;ty=e.touches[0].clientY;moved=false;tt=Date.now()},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],dx=t.clientX-tx,dy=t.clientY-ty;
 if(Math.hypot(dx,dy)>26){moved=true;Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy));tx=t.clientX;ty=t.clientY}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(!moved&&Date.now()-tt<220){if(Date.now()-lastTap<300){dash();lastTap=0}else lastTap=Date.now()}},{passive:false});
$('#db').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();dash()},{passive:false});
$('#db').onclick=dash;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
$('#pb').onclick=()=>pause(true);$('#res').onclick=()=>pause(false);
$('#quit').onclick=()=>{if(G&&G.alive){S.time+=G.t/1000;S.coins+=G.coins;S.hi=Math.max(S.hi,G.score);save()}home()};

/* ---------- menu & shop ---------- */
function home(){G=null;paused=false;document.body.classList.remove('paused');layout();$('#st').textContent=`Record ${S.hi}  ·  🪙 ${S.coins}  ·  Partite ${S.games}  ·  ${Math.round(S.time/60)} min`;setState('menu')}
function showOver(g){$('#ot').textContent=g.rec?'Nuovo record!':'Game over';$('#os').textContent=g.score;$('#oc').textContent=`+${g.coins} 🪙 raccolte  ·  Record ${S.hi}`;setState('over')}
$('#play').onclick=$('#again').onclick=startGame;$('#ohome').onclick=home;$('#back').onclick=home;
$('#lab').onclick=$('#olab').onclick=()=>{G=null;layout();shop();setState('shop')};
function shop(tab=stab){stab=tab;let h=`<div class="coins">🪙 ${S.coins}</div><div class="tabs">${[['up','Upgrade'],['skin','Skin'],['data','Dati']].map(([k,n])=>`<button data-t="${k}" class="${k==tab?'on':''}">${n}</button>`).join('')}</div>`;
 if(tab=='up')h+=UP.map(u=>{const l=lv(u.id),mx=l>=u.max,p=u.c(l);return`<div class="row"><div><b>${u.n}</b><small>${u.d}</small><i class="pips">${'●'.repeat(l)}${'○'.repeat(u.max-l)}</i></div><button data-up="${u.id}" ${mx||S.coins<p?'disabled':''}>${mx?'MAX':'🪙 '+p}</button></div>`}).join('');
 if(tab=='skin')h+=SKINS.map(k=>{const o=own(k);return`<div class="row"><div><b><i class="sw" style="background:linear-gradient(90deg,${k.c1},${k.c2})"></i>${k.n}</b><small>${o?'Sbloccata':k.score?`🪙 ${k.cost} oppure record ${k.score}`:`🪙 ${k.cost}`}</small></div><button data-sk="${k.id}" ${!o&&S.coins<k.cost?'disabled':''}>${o?(S.skin==k.id?'In uso':'Usa'):'🪙 '+k.cost}</button></div>`}).join('');
 if(tab=='data')h+=`<div class="row"><div><b>Backup</b><small>Salva o ripristina i progressi (JSON)</small></div></div><div class="row"><button data-a="exp">Esporta</button><button data-a="imp">Importa</button><button data-a="snd">Suono ${S.snd?'on':'off'}</button></div>`;
 $('#sb').innerHTML=h}
$('#sb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.t)return shop(d.t);
 if(d.up){const u=UP.find(x=>x.id==d.up),l=lv(u.id),p=u.c(l);if(S.coins>=p&&l<u.max){S.coins-=p;S.up[u.id]=l+1;save();snd(700,.1,'triangle')}}
 if(d.sk){const k=SKINS.find(x=>x.id==d.sk);if(!own(k)&&S.coins>=k.cost){S.coins-=k.cost;S.own.push(k.id)}if(own(k))S.skin=k.id;save()}
 if(d.a=='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='snake-overcharge-save.json';a.click();return}
 if(d.a=='imp')return $('#fi').click();if(d.a=='snd'){S.snd^=1;save()}shop()};
$('#fi').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{const o=JSON.parse(t);if(typeof o.coins!='number')throw 0;S={...def,...o};save();shop()}).catch(()=>alert('File di salvataggio non valido'))};
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});$('#inst').onclick=()=>{if(dp){dp.prompt();dp=null;$('#inst').hidden=true}};

/* ---------- rendering ---------- */
function pts(g){const a=Math.max(0,Math.min(1,g.acc/tickMs(g)));return g.snake.map((s,i)=>{const p=g.prev[Math.min(i,g.prev.length-1)];let x=s.x,y=s.y;if(Math.abs(s.x-p.x)<=1&&Math.abs(s.y-p.y)<=1){x=p.x+(s.x-p.x)*a;y=p.y+(s.y-p.y)*a}return[ox+(x+.5)*cell,oy+(y+.5)*cell]})}
function drawSnake(g){const P=pts(g),n=P.length,r=cell/2,sk=SKINS.find(s=>s.id==S.skin),F=g.fx;c.save();
 if(F.ghost>0)c.globalAlpha=.45;if(F.inv>0&&((g.t/80|0)%2))c.globalAlpha*=.5;
 for(let i=n-1;i>=0;i--){const[x,y]=P[i],k=i/n;
  if(sk.id=='neon'){c.fillStyle=`hsl(${150+k*40},100%,${62-k*20}%)`;c.shadowColor='#39ff9c';c.shadowBlur=10;c.beginPath();c.arc(x,y,r*(.92-.3*k),0,6.29);c.fill()}
  else if(sk.id=='pixel'){c.fillStyle=i%2?sk.c1:sk.c2;const s=cell*.88;c.fillRect(x-s/2,y-s/2,s,s)}
  else{const s=cell*.84;c.fillStyle=i%2?sk.c1:sk.c2;c.strokeStyle='rgba(61,240,255,.6)';c.lineWidth=1.5;c.beginPath();c.roundRect(x-s/2,y-s/2,s,s,cell*.2);c.fill();c.stroke()}}
 c.shadowBlur=0;const[hx,hy]=P[0],d=g.dir,px=-d.y,py=d.x;
 if(sk.id=='pixel'){c.fillStyle=sk.c2;for(const s of[-1,1])c.fillRect(hx-d.x*r*.6+px*r*.8*s-r*.15,hy-d.y*r*.6+py*r*.8*s-r*.15,r*.3,r*.3)}
 if(sk.id=='mecha'){c.fillStyle='#2a3350';c.beginPath();c.roundRect(hx-r*.9,hy-r*.9,r*1.8,r*1.8,cell*.25);c.fill()}
 for(const s of[-1,1]){const ex=hx+d.x*r*.35+px*r*.42*s,ey=hy+d.y*r*.35+py*r*.42*s;c.fillStyle=sk.e;c.beginPath();c.arc(ex,ey,r*.24,0,6.29);c.fill();if(sk.id!='mecha'){c.fillStyle='#111';c.beginPath();c.arc(ex+d.x*r*.07,ey+d.y*r*.07,r*.11,0,6.29);c.fill()}}
 c.restore();c.save();c.lineWidth=2;
 if(F.shield){c.strokeStyle='#3df0ff';c.shadowColor='#3df0ff';c.shadowBlur=14;c.beginPath();c.arc(hx,hy,r*1.25+Math.sin(g.t/120),0,6.29);c.stroke()}
 if(F.mag>0){c.strokeStyle='rgba(61,139,255,.55)';c.setLineDash([6,6]);c.lineDashOffset=-g.t/40;c.beginPath();c.arc(hx,hy,cell*3.2,0,6.29);c.stroke()}
 c.restore()}
function drawItems(g){for(const it of g.items){const x=ox+(it.x+.5)*cell,y=oy+(it.y+.5)*cell,r=cell/2;c.save();
 if(it.type=='food'){const p=1+.1*Math.sin(g.t/140+it.x);c.fillStyle='#ff3d81';c.shadowColor='#ff3d81';c.shadowBlur=16;c.beginPath();c.arc(x,y,r*.6*p,0,6.29);c.fill()}
 else if(it.type=='coin'){if(it.ttl<2500&&(g.t/120|0)%2){c.restore();continue}c.fillStyle='#ffc83d';c.shadowColor='#ffc83d';c.shadowBlur=12;c.beginPath();c.ellipse(x,y,Math.max(2,r*.62*Math.abs(Math.cos(g.t/260))),r*.62,0,0,6.29);c.fill()}
 else{if(it.ttl<2500&&(g.t/120|0)%2){c.restore();continue}const m=PW[it.type];c.fillStyle=m.c+'33';c.strokeStyle=m.c;c.lineWidth=2;c.shadowColor=m.c;c.shadowBlur=12;c.beginPath();c.arc(x,y,r*.92,0,6.29);c.fill();c.stroke();
  c.shadowBlur=0;c.beginPath();c.arc(x,y,r*1.08,-1.57,-1.57+6.28*it.ttl/it.max);c.stroke();c.font=`${cell*.66}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(m.e,x,y+1)}

function draw(dt){c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#070716';c.fillRect(0,0,W,H);
 for(const a of amb){a.y=(a.y-a.v*dt/1000+1)%1;c.fillStyle='rgba(120,150,255,.25)';c.fillRect(a.x*W,a.y*H,a.s,a.s)}
 const g=G,F=g&&g.fx,ov=g&&F.over>0,gh=g&&F.ghost>0,aw=cols*cell,ah=rows*cell;c.save();
 if(g&&g.shake>.3)c.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);
 c.fillStyle=ov?'#1c1606':'#0b0b22';c.fillRect(ox,oy,aw,ah);

 for(let i=0;i<=cols;i++){c.moveTo(ox+i*cell+.5,oy);c.lineTo(ox+i*cell+.5,oy+ah)}

 c.stroke();c.strokeStyle=gh?'#c89bff':ov?'#ffc83d':'#3df0ff';c.lineWidth=2;c.setLineDash(gh?[8,8]:[]);c.shadowColor=c.strokeStyle;c.shadowBlur=12;c.strokeRect(ox,oy,aw,ah);c.setLineDash([]);c.shadowBlur=0;
 if(g){drawItems(g);drawSnake(g);for(const p of g.parts){c.globalAlpha=Math.max(0,p.life/p.max);c.fillStyle=p.c;c.fillRect(ox+p.x*cell-p.s/2,oy+p.y*cell-p.s/2,p.s,p.s)}c.globalAlpha=1}
 c.restore();if(g&&state=='play')hud(g)}
let fxKey='';function hud(g){const F=g.fx,t=s=>{const e=$(s);return e};
 $('#sc').textContent=g.score;$('#co').textContent='🪙 '+(S.coins+g.coins);$('#sta').style.width=g.stam+'%';
 const k=['mag','ghost','over'].map(n=>F[n]>0?Math.ceil(F[n]/1000):0).join()+F.shield;
 if(k!=fxKey){fxKey=k;$('#fx').innerHTML=['mag','ghost','over'].filter(n=>F[n]>0).map(n=>`<span class="chip">${PW[n].e} ${Math.ceil(F[n]/1000)}s</span>`).join('')+(F.shield?'<span class="chip">🛡️</span>':'')}}
function frame(ts){requestAnimationFrame(frame);let dt=Math.min(ts-last,50);last=ts;if(!(dt>0))dt=16;
 if(G&&!paused){if(G.freeze>0){G.freeze-=dt;dt=0}
  if(G.alive&&state=='play')update(G,dt);G.shake*=Math.exp(-dt/110);
  for(const p of G.parts){p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.life-=dt}G.parts=G.parts.filter(p=>p.life>0)}
 draw(paused?0:dt)}
requestAnimationFrame(frame);

/* ---------- intro: il serpente attraversa lo schermo ---------- */
(function(){const cv=$('#ic'),x=cv.getContext('2d'),d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight,port=h>w,L=port?h:w,Wd=port?w:h,T=3600,N=70,du=.0055,R=Math.max(8,Math.min(w,h)*.03);
 cv.width=w*d;cv.height=h*d;x.scale(d,d);let fin=false;const t0=performance.now();
 const pos=u=>{const m=-.1*L+u*1.2*L,v=Wd/2+Math.sin(u*Math.PI*5.5)*Wd*.34+Math.sin(u*Math.PI*14)*Wd*.03;return port?[v,m]:[m,v]};
 const ease=t=>.5-.5*Math.cos(Math.PI*t);
 function end(){if(fin)return;fin=true;$('#intro').classList.add('out');home();setTimeout(()=>$('#intro').remove(),800)}
 $('#intro').onclick=end;
 function f(now){if(fin)return;const e=now-t0,hu=ease(Math.min(1,e/T))*1.17;
  x.fillStyle='#070716';x.fillRect(0,0,w,h);x.strokeStyle='rgba(120,140,255,.06)';x.beginPath();for(let i=0;i<w;i+=40){x.moveTo(i,0);x.lineTo(i,h)}for(let j=0;j<h;j+=40){x.moveTo(0,j);x.lineTo(w,j)}x.stroke();
  const hp=pos(hu),hm=port?hp[1]:hp[0],fs=Math.min(w*.2,120);
  x.save();x.beginPath();port?x.rect(0,0,w,hm):x.rect(0,0,hm,h);x.clip();x.textAlign='center';x.textBaseline='middle';
  x.font=`900 italic ${fs}px "Arial Black","Trebuchet MS",sans-serif`;x.fillStyle='#39ff9c';x.shadowColor='#39ff9c';x.shadowBlur=30;x.fillText('SNAKE',w/2,h/2-fs*.45);
  x.font=`900 italic ${fs*.5}px "Arial Black","Trebuchet MS",sans-serif`;const gr=x.createLinearGradient(w/2-fs*1.4,0,w/2+fs*1.4,0);gr.addColorStop(0,'#ffc83d');gr.addColorStop(1,'#ff3d81');x.fillStyle=gr;x.shadowColor='#ff3d81';x.fillText('OVERCHARGE',w/2,h/2+fs*.35);x.restore();
  for(let i=N;i>=0;i--){const p=pos(hu-i*du),k=i/N;x.fillStyle=`hsl(${150+k*50},100%,${60-k*18}%)`;x.shadowColor='#39ff9c';x.shadowBlur=18;x.beginPath();x.arc(p[0],p[1],R*(1-.6*k),0,6.29);x.fill()}
  x.shadowBlur=0;const q=pos(hu+.003),dx=q[0]-hp[0],dy=q[1]-hp[1],l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l;
  if((now/120|0)%2){x.strokeStyle='#ff3d4d';x.lineWidth=3;x.beginPath();x.moveTo(hp[0]+ux*R,hp[1]+uy*R);x.lineTo(hp[0]+ux*R*2.3,hp[1]+uy*R*2.3);x.stroke()}
  for(const s of[-1,1]){const ex=hp[0]+ux*R*.35-uy*R*.45*s,ey=hp[1]+uy*R*.35+ux*R*.45*s;x.fillStyle='#fff';x.beginPath();x.arc(ex,ey,R*.28,0,6.29);x.fill();x.fillStyle='#111';x.beginPath();x.arc(ex+ux*R*.08,ey+uy*R*.08,R*.13,0,6.29);x.fill()}
  if(e>T+700)return end();requestAnimationFrame(f)}
 requestAnimationFrame(f)})();

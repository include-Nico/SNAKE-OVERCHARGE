<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SNAKE: OVERCHARGE</title>
<meta name="theme-color" content="#070716">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overcharge">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-green: #39ff9c;
  --neon-blue: #3df0ff;
  --neon-pink: #ff3d81;
  --neon-gold: #ffc83d;
  --bg-dark: #070716;
  --bg-glass: rgba(18, 18, 56, 0.55);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg-dark); color: #eaf0ff; font-family: 'Orbitron', sans-serif; touch-action: none; overscroll-behavior: none; }

/* Animated Background Grid */
.bg-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(61, 240, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(61, 240, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; animation: gridMove 4s linear infinite; z-index: -1; }
@keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 40px 40px; } }

canvas { position: fixed; inset: 0; z-index: 1; }

.scr { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 20px; z-index: 10; background: radial-gradient(circle at center, rgba(7,7,22,0.6) 0%, rgba(7,7,22,0.95) 100%); animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }

body[data-s=menu] #home, body[data-s=shop] #shop, body[data-s=over] #over, body.paused #pz { display: flex; }

#intro { position: fixed; inset: 0; z-index: 99; background: var(--bg-dark); transition: opacity 0.8s ease; }
#intro.out { opacity: 0; pointer-events: none; }

/* Enhanced Glassmorphism */
.glass { background: var(--bg-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(140, 160, 255, 0.15); border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(61, 240, 255, 0.05); }

h1 { text-align: center; line-height: 1; font-weight: 900; font-size: clamp(40px, 12vw, 90px); color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green), 0 0 30px rgba(57, 255, 156, 0.6); margin-bottom: 10px; font-style: italic; }
h1 small { display: block; font-size: 0.45em; background: linear-gradient(90deg, var(--neon-gold), var(--neon-pink)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 8px rgba(255, 61, 129, 0.8)); margin-top: 5px; }
h2 { font-weight: 900; font-size: 40px; color: var(--neon-pink); text-shadow: 0 0 20px rgba(255, 61, 129, 0.8); font-style: italic; }

/* Buttons */
.btn { font-family: inherit; font-weight: 900; font-size: 18px; color: #000; background: linear-gradient(135deg, var(--neon-green), var(--neon-blue)); border: none; border-radius: 12px; padding: 16px 32px; min-width: 240px; box-shadow: 0 0 20px rgba(57, 255, 156, 0.4); cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 1px; position: relative; overflow: hidden; }
.btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition: 0.5s; }
.btn:hover::after { left: 100%; }
.btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 30px rgba(61, 240, 255, 0.6); }
.btn:active { transform: translateY(1px) scale(0.98); }

.btn.alt { background: rgba(255, 255, 255, 0.03); color: var(--neon-blue); border: 2px solid var(--neon-blue); box-shadow: 0 0 10px rgba(61, 240, 255, 0.2); }
.btn.alt:hover { background: rgba(61, 240, 255, 0.1); box-shadow: 0 0 25px rgba(61, 240, 255, 0.5); }
button:disabled { opacity: 0.4; filter: grayscale(1); pointer-events: none; }

.big { font-weight: 900; font-size: 72px; color: var(--neon-gold); text-shadow: 0 0 30px rgba(255, 200, 61, 0.6); }
.muted { color: #9aa7d6; font-size: 14px; letter-spacing: 0.5px; opacity: 0.8; }

/* HUD */
#hud { position: fixed; top: 0; left: 0; right: 0; height: 70px; padding: 0 20px; display: none; align-items: center; gap: 15px; pointer-events: none; z-index: 5; background: linear-gradient(180deg, rgba(7,7,22,0.9) 0%, transparent 100%); }
body[data-s=play] #hud { display: flex; }
#sc { font-weight: 900; font-size: 32px; color: var(--neon-green); min-width: 70px; text-shadow: 0 0 15px var(--neon-green); }
#co { font-weight: 700; color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }

.bar { width: 100px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 5px rgba(0,0,0,0.5); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-green)); box-shadow: 0 0 10px var(--neon-blue); transition: width 0.1s linear; }

#fx { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; justify-content: flex-end; }
.chip { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 5px; }

#pb { pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(140, 160, 255, 0.3); background: var(--bg-glass); color: #fff; font-size: 18px; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); }
#pb:hover { background: rgba(255,255,255,0.2); border-color: #fff; }

/* Virtual D-Pad / Dash */
#db { position: fixed; right: 24px; bottom: 30px; width: 80px; height: 80px; border-radius: 50%; display: none; border: 2px solid var(--neon-blue); background: rgba(61, 240, 255, 0.1); color: var(--neon-blue); font-weight: 900; font-size: 14px; box-shadow: 0 0 30px rgba(61, 240, 255, 0.3); touch-action: none; z-index: 5; text-transform: uppercase; letter-spacing: 1px; }
body[data-s=play].touch #db { display: block; }
#db:active { background: rgba(61, 240, 255, 0.3); transform: scale(0.95); }

/* Shop UI */
#sh { width: min(92vw, 500px); max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 5px; scrollbar-width: thin; scrollbar-color: var(--neon-blue) transparent; }
#sh::-webkit-scrollbar { width: 6px; }
#sh::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 3px; }

.tabs { display: flex; gap: 8px; margin-bottom: 10px; }
.tabs button { flex: 1; font-family: inherit; font-weight: 700; font-size: 14px; padding: 12px; border-radius: 10px; border: 1px solid rgba(140, 160, 255, 0.2); background: rgba(0,0,0,0.3); color: #9aa7d6; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
.tabs button.on { background: rgba(57, 255, 156, 0.15); color: var(--neon-green); border-color: var(--neon-green); box-shadow: 0 0 15px rgba(57, 255, 156, 0.2); }

.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
.row:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
.row b { display: block; font-size: 16px; color: #fff; letter-spacing: 0.5px; }
.row small { display: block; color: #9aa7d6; font-weight: 400; font-family: system-ui, sans-serif; font-size: 13px; margin-top: 4px; }
.row button { font-family: inherit; font-weight: 800; border: none; border-radius: 8px; padding: 10px 16px; background: var(--neon-gold); color: #1a1200; min-width: 90px; cursor: pointer; transition: 0.2s; }
.row button:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 200, 61, 0.5); }

.pips { color: var(--neon-green); letter-spacing: 3px; font-style: normal; font-size: 14px; margin-top: 6px; display: block; text-shadow: 0 0 5px var(--neon-green); }
.sw { display: inline-block; width: 36px; height: 14px; border-radius: 7px; margin-right: 10px; vertical-align: middle; border: 1px solid rgba(255,255,255,0.2); }
.coins { font-weight: 900; font-size: 26px; color: var(--neon-gold); text-align: center; margin-bottom: 10px; text-shadow: 0 0 15px rgba(255, 200, 61, 0.4); }

@media(prefers-reduced-motion:reduce){ #intro, .scr, .btn { transition: none; animation: none; } }
</style>
</head>
<body>
<div class="bg-grid"></div>
<canvas id="g"></canvas>

<div id="hud">
  <div id="sc">0</div><div id="co">🪙 0</div>
  <div class="bar" title="Stamina Scatto"><i id="sta"></i></div>
  <div id="fx"></div>
  <button id="pb" aria-label="Pausa">❚❚</button>
</div>
<button id="db">DASH</button>

<div class="scr" id="home">
  <h1>SNAKE<small>OVERCHARGE</small></h1>
  <p class="muted" id="st"></p>
  <button class="btn" id="play">Inizia Sessione</button>
  <button class="btn alt" id="lab">Laboratorio Dati</button>
  <button class="btn alt" id="inst" hidden>Installa Modulo</button>
</div>

<div class="scr" id="shop">
  <div class="glass" id="sh"><div id="sb"></div></div>
  <button class="btn alt" id="back">Disconnetti</button>
  <input type="file" id="fi" accept="application/json" hidden>
</div>

<div class="scr" id="over">
  <h2 id="ot"></h2>
  <div class="big" id="os">0</div>
  <p class="muted" id="oc"></p>
  <button class="btn" id="again">Riavvia Ciclo</button>
  <button class="btn alt" id="olab">Laboratorio</button>
  <button class="btn alt" id="ohome">Menu Principale</button>
</div>

<div class="scr" id="pz" style="z-index: 20;">
  <h2>PAUSA SISTEMA</h2>
  <button class="btn" id="res">Riprendi</button>
  <button class="btn alt" id="quit">Interrompi</button>
</div>

<div id="intro"><canvas id="ic"></canvas></div>

<script>
const $ = s => document.querySelector(s), rand = n => Math.floor(Math.random() * n), SK = 'snake-overcharge-v2';
const UP = [
 {id:'mag',n:'Batteria Magnetica',d:'+1s durata Magnete',max:5,c:l=>40+l*40},
 {id:'ghost',n:'Spettro Stabile',d:'+1s durata Spettro',max:5,c:l=>40+l*40},
 {id:'over',n:'Overclock Esteso',d:'+1s durata Overclock',max:5,c:l=>60+l*50},
 {id:'dash',n:'Efficienza Scatto',d:'Ricarica Stamina accelerata',max:5,c:l=>30+l*35},
 {id:'shield',n:'Frequenza Scudo',d:'+8% spawn Scudo',max:5,c:l=>50+l*45}];
const SKINS = [
 {id:'neon',n:'Neon Vector',cost:0,c1:'#39ff9c',c2:'#3df0ff',e:'#fff',p:['#39ff9c','#3df0ff']},
 {id:'pixel',n:'Hi-Bit Dragon',cost:150,c1:'#ff9d3d',c2:'#c2412d',e:'#ffe98a',p:['#ff9d3d','#ffd23d','#c2412d']},
 {id:'mecha',n:'Mecha Viper',cost:350,score:600,c1:'#9aa7c7',c2:'#4b5878',e:'#ff3d4d',p:['#9aa7c7','#ff3d4d','#fff']}];
const PW = {mag:{e:'🧲',c:'#3d8bff'},ghost:{e:'👻',c:'#c89bff'},shield:{e:'🛡️',c:'#3df0ff'},cut:{e:'✂️',c:'#ff3d4d'},over:{e:'✨',c:'#ffc83d'}};
const def = {coins:0,hi:0,time:0,games:0,up:{},skin:'neon',own:['neon'],snd:1};
let S; try { S = {...def, ...JSON.parse(localStorage.getItem(SK))} } catch(e) { S = {...def} }
const save = () => { try { localStorage.setItem(SK, JSON.stringify(S)) } catch(e){} };
const lv = id => S.up[id] || 0;
const own = k => S.own.includes(k.id) || (k.score && S.hi >= k.score);

let ac;
function snd(f, d=0.08, t='square', v=0.04) {
  if(!S.snd) return;
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch(e) {}
}

/* ---------- STATO E LAYOUT ---------- */
let G = null, state = 'intro', paused = false, last = 0, stab = 'up', W, H, DPR, cell = 20, cols = 18, rows = 18, ox = 0, oy = 0;
const cv = $('#g'), c = cv.getContext('2d');
const setState = s => { state = s; document.body.dataset.s = s; };

function layout() {
  const top = 70; let a = G ? G.cols : 0, b = G ? G.rows : 0;
  if (!a) {
    cell = Math.max(16, Math.floor(Math.min(W, H - top) / 18));
    a = cols = Math.floor(W / cell); b = rows = Math.floor((H - top) / cell);
  } else { cell = Math.floor(Math.min(W / a, (H - top) / b)); }
  ox = Math.floor((W - a * cell) / 2); oy = top + Math.floor((H - top - b * cell) / 2);
}

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  layout();
}
addEventListener('resize', resize); resize();
if (matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');

/* ---------- CORE LOGIC ---------- */
function newGame() {
  const x = cols >> 1, y = rows >> 1;
  const g = {
    cols, rows, snake: [{x,y}, {x:x-1,y}, {x:x-2,y}], dir: {x:1,y:0}, q: [], items: [], 
    fx: {mag:0, ghost:0, over:0, shield:0, inv:0}, score: 0, coins: 0, stam: 100, dash: 0, 
    acc: -600, t: 0, pT: 6000, cT: 3000, alive: true, shake: 0, freeze: 0, eaten: 0, grow: 0, parts: []
  };
  g.prev = g.snake.map(s => ({...s})); spawn(g, 'food', 1e9); return g;
}

function startGame() {
  G = null; layout(); G = newGame(); paused = false;
  document.body.classList.remove('paused'); setState('play'); snd(440, 0.1);
}

function spawn(g, type, ttl) {
  for (let i = 0; i < 200; i++) {
    const x = rand(g.cols), y = rand(g.rows);
    if (!g.snake.some(s => s.x == x && s.y == y) && !g.items.some(s => s.x == x && s.y == y)) {
      g.items.push({type, x, y, ttl, max: ttl}); return;
    }
  }
}

// Fisica delle particelle migliorata
function burst(g, p, col, n, sp = 6) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (0.5 + Math.random()), l = 400 + Math.random() * 500;
    g.parts.push({ x: p.x + 0.5, y: p.y + 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: l, max: l, c: col, s: cell * 0.25 * (0.4 + Math.random()) });
  }
}

const tickMs = g => Math.max(80, 135 - g.eaten * 1.2) * (g.dash > 0 ? 0.45 : 1);

function collect(g, it) {
  const F = g.fx, m = F.over > 0 ? 2 : 1, h = g.snake[0];
  if (it.type == 'food') {
    g.score += 10 * m; g.grow++; g.eaten++; spawn(g, 'food', 1e9);
    burst(g, h, '#ff3d81', 12); g.shake = Math.max(g.shake, 4); snd(520, 0.08);
  } else if (it.type == 'coin') {
    g.coins += m; g.score += 5 * m; burst(g, h, '#ffc83d', 10); snd(880, 0.06, 'triangle');
  } else {
    burst(g, h, PW[it.type].c, 16, 7); g.shake = Math.max(g.shake, 6); snd(660, 0.18, 'sawtooth');
    if (it.type == 'shield') F.shield = 1;
    else if (it.type == 'cut') {
      const old = g.snake.length - 1, keep = Math.max(3, Math.ceil(old / 2));
      g.coins += (old - keep) * m; g.snake.length = Math.min(g.snake.length, keep + 1); g.grow = 0;
    } else F[it.type] = (5 + lv(it.type)) * 1000;
  }
}

function die(g) {
  g.rec = g.score > S.hi; g.alive = false; g.freeze = 150; g.shake = 25;
  S.coins += g.coins; S.hi = Math.max(S.hi, g.score); S.games++; S.time += g.t / 1000; save();
  const p = SKINS.find(s => s.id == S.skin).p;
  g.snake.forEach((s, i) => burst(g, s, p[i % p.length], 4, 8));
  snd(90, 0.6, 'sawtooth', 0.15); setTimeout(() => showOver(g), 850);
}

function step(g) {
  g.prev = g.snake.map(s => ({...s}));
  if (g.q.length) g.dir = g.q.shift();
  const h = g.snake[0], F = g.fx;
  let nx = h.x + g.dir.x, ny = h.y + g.dir.y;
  const wall = nx < 0 || ny < 0 || nx >= g.cols || ny >= g.rows;
  const body = g.snake.some((s, i) => i < g.snake.length - 1 && s.x == nx && s.y == ny);
  
  if ((wall || body) && F.ghost <= 0 && F.inv <= 0) {
    if (F.shield) { F.shield = 0; F.inv = 1000; g.shake = 15; snd(120, 0.2, 'sawtooth'); }
    else return die(g);
  }
  if (wall) { nx = (nx + g.cols) % g.cols; ny = (ny + g.rows) % g.rows; }
  
  g.snake.unshift({x: nx, y: ny});
  
  let k = g.items.findIndex(i => i.x == nx && i.y == ny);
  if (k >= 0) collect(g, g.items.splice(k, 1)[0]);
  
  if (F.mag > 0) {
    for (const it of g.items) {
      const dx = nx - it.x, dy = ny - it.y;
      if (Math.hypot(dx, dy) <= 3.5) {
        if (Math.abs(dx) >= Math.abs(dy)) it.x += Math.sign(dx); else it.y += Math.sign(dy);
      }
    }
    while ((k = g.items.findIndex(i => i.x == nx && i.y == ny)) >= 0) collect(g, g.items.splice(k, 1)[0]);
  }
  if (g.grow > 0) g.grow--; else g.snake.pop();
}

function update(g, dt) {
  g.t += dt; const F = g.fx;
  for (const k of ['mag', 'ghost', 'over', 'inv']) F[k] = Math.max(0, F[k] - dt);
  g.dash = Math.max(0, g.dash - dt);
  g.stam = Math.min(100, g.stam + dt * (12 + 6 * lv('dash')) / 1000);
  
  if ((g.pT -= dt) <= 0) {
    g.pT = 7000 + rand(4000);
    const t = Math.random() < 0.15 + 0.08 * lv('shield') ? 'shield' : ['mag', 'ghost', 'cut', 'over'][rand(4)];
    spawn(g, t, 8000);
  }
  if ((g.cT -= dt) <= 0) {
    g.cT = 2500 + rand(2500);
    if (g.items.filter(i => i.type == 'coin').length < 3) spawn(g, 'coin', 10000);
  }
  for (const it of g.items) if (it.type != 'food') it.ttl -= dt;
  g.items = g.items.filter(i => i.ttl > 0);
  
  if (F.over > 0 && Math.random() < 0.3) burst(g, {x: rand(g.cols), y: rand(g.rows)}, '#ffc83d', 1, 2);
  
  g.acc += dt; let tk = tickMs(g);
  while (g.acc >= tk && g.alive) { g.acc -= tk; step(g); tk = tickMs(g); }
}

function dash() {
  const g = G; if (state != 'play' || paused || !g || !g.alive || g.dash > 0) return;
  if (g.stam >= 40) g.stam -= 40; else if (g.snake.length > 4) g.snake.pop(); else return;
  g.dash = 500; g.shake = Math.max(g.shake, 5); snd(300, 0.15, 'sawtooth');
}

function setDir(x, y) {
  const g = G; if (state != 'play' || paused || !g || !g.alive) return;
  const l = g.q.length ? g.q[g.q.length - 1] : g.dir;
  if ((l.x == -x && l.y == -y) || (l.x == x && l.y == y) || g.q.length >= 2) return;
  g.q.push({x, y});
}
function pause(on) { if (state != 'play' || !G || !G.alive) return; paused = on; document.body.classList.toggle('paused', on); }

/* ---------- INPUT ---------- */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), m = {arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1], arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0]}[k];
  if (m) { setDir(...m); e.preventDefault(); } else if (k == ' ') { dash(); e.preventDefault(); } else if (k == 'p' || k == 'escape') pause(!paused);
});
let tx, ty, tt = 0, moved = false, lastTap = 0;
cv.addEventListener('touchstart', e => { e.preventDefault(); if (e.touches.length > 1) return dash(); tx = e.touches[0].clientX; ty = e.touches[0].clientY; moved = false; tt = Date.now(); }, {passive: false});
cv.addEventListener('touchmove', e => {
  e.preventDefault(); const t = e.touches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.hypot(dx, dy) > 26) { moved = true; Math.abs(dx) > Math.abs(dy) ? setDir(Math.sign(dx), 0) : setDir(0, Math.sign(dy)); tx = t.clientX; ty = t.clientY; }
}, {passive: false});
cv.addEventListener('touchend', e => {
  e.preventDefault();
  if (!moved && Date.now() - tt < 220) { if (Date.now() - lastTap < 300) { dash(); lastTap = 0; } else lastTap = Date.now(); }
}, {passive: false});
$('#db').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); dash(); }, {passive: false});
$('#db').onclick = dash;
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });
$('#pb').onclick = () => pause(true); $('#res').onclick = () => pause(false);
$('#quit').onclick = () => { if (G && G.alive) { S.time += G.t / 1000; S.coins += G.coins; S.hi = Math.max(S.hi, G.score); save(); } home(); };

/* ---------- UI & SHOP ---------- */
function home() {
  G = null; paused = false; document.body.classList.remove('paused'); layout();
  $('#st').textContent = `RECORD: ${S.hi}  ·  🪙 ${S.coins}  ·  RUNS: ${S.games}`; setState('menu');
}
function showOver(g) {
  $('#ot').textContent = g.rec ? 'NUOVO RECORD!' : 'SISTEMA OFFLINE';
  $('#os').textContent = g.score;
  $('#oc').textContent = `+${g.coins} 🪙  ·  Record: ${S.hi}`; setState('over');
}
$('#play').onclick = $('#again').onclick = startGame; $('#ohome').onclick = home; $('#back').onclick = home;
$('#lab').onclick = $('#olab').onclick = () => { G = null; layout(); shop(); setState('shop'); };

function shop(tab = stab) {
  stab = tab;
  let h = `<div class="coins">🪙 ${S.coins}</div><div class="tabs">${[['up','Moduli'],['skin','Skin'],['data','Dati']].map(([k,n]) => `<button data-t="${k}" class="${k == tab ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  if (tab == 'up') h += UP.map(u => { const l = lv(u.id), mx = l >= u.max, p = u.c(l); return `<div class="row"><div><b>${u.n}</b><small>${u.d}</small><i class="pips">${'■'.repeat(l)}${'□'.repeat(u.max-l)}</i></div><button data-up="${u.id}" ${mx || S.coins < p ? 'disabled' : ''}>${mx ? 'MAX' : '🪙 '+p}</button></div>`; }).join('');
  if (tab == 'skin') h += SKINS.map(k => { const o = own(k); return `<div class="row"><div><b><i class="sw" style="background:linear-gradient(90deg,${k.c1},${k.c2})"></i>${k.n}</b><small>${o ? 'Autorizzato' : k.score ? `🪙 ${k.cost} o record ${k.score}` : `🪙 ${k.cost}`}</small></div><button data-sk="${k.id}" ${!o && S.coins < k.cost ? 'disabled' : ''}>${o ? (S.skin == k.id ? 'Attivo' : 'Equip') : '🪙 '+k.cost}</button></div>`; }).join('');
  if (tab == 'data') h += `<div class="row"><div><b>Backup Sistema</b><small>Salvataggio / Ripristino JSON</small></div></div><div class="row"><button data-a="exp">Esporta</button><button data-a="imp">Importa</button><button data-a="snd">Audio: ${S.snd ? 'ON' : 'OFF'}</button></div>`;
  $('#sb').innerHTML = h;
}

$('#sb').onclick = e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset; if (d.t) return shop(d.t);
  if (d.up) { const u = UP.find(x => x.id == d.up), l = lv(u.id), p = u.c(l); if (S.coins >= p && l < u.max) { S.coins -= p; S.up[u.id] = l + 1; save(); snd(700, 0.1, 'triangle'); } }
  if (d.sk) { const k = SKINS.find(x => x.id == d.sk); if (!own(k) && S.coins >= k.cost) { S.coins -= k.cost; S.own.push(k.id); } if (own(k)) S.skin = k.id; save(); }
  if (d.a == 'exp') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'})); a.download = 'overcharge-data.json'; a.click(); return; }
  if (d.a == 'imp') return $('#fi').click();
  if (d.a == 'snd') { S.snd ^= 1; save(); } shop();
};

$('#fi').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => { const o = JSON.parse(t); if (typeof o.coins != 'number') throw 0; S = {...def, ...o}; save(); shop(); }).catch(() => alert('Dati corrotti.')); };
let dp; addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; $('#inst').hidden = false; }); $('#inst').onclick = () => { if (dp) { dp.prompt(); dp = null; $('#inst').hidden = true; } };

/* ---------- RENDERING JUCINESS ---------- */
function pts(g) {
  const a = Math.max(0, Math.min(1, g.acc / tickMs(g)));
  return g.snake.map((s, i) => {
    const p = g.prev[Math.min(i, g.prev.length - 1)]; let x = s.x, y = s.y;
    if (Math.abs(s.x - p.x) <= 1 && Math.abs(s.y - p.y) <= 1) { x = p.x + (s.x - p.x) * a; y = p.y + (s.y - p.y) * a; }
    return [ox + (x + 0.5) * cell, oy + (y + 0.5) * cell];
  });
}

function drawSnake(g) {
  const P = pts(g), n = P.length, r = cell / 2, sk = SKINS.find(s => s.id == S.skin), F = g.fx; c.save();
  if (F.ghost > 0) c.globalAlpha = 0.45;
  if (F.inv > 0 && ((g.t / 80 | 0) % 2)) c.globalAlpha *= 0.5;
  
  for (let i = n - 1; i >= 0; i--) {
    const [x, y] = P[i], k = i / n;
    if (sk.id == 'neon') {
      c.fillStyle = `hsl(${150 + k * 40}, 100%, ${62 - k * 20}%)`;
      c.shadowColor = '#39ff9c'; c.shadowBlur = 12;
      c.beginPath(); c.arc(x, y, r * (0.95 - 0.25 * k), 0, 6.29); c.fill();
    } else if (sk.id == 'pixel') {
      c.fillStyle = i % 2 ? sk.c1 : sk.c2; const s = cell * 0.88;
      c.fillRect(x - s / 2, y - s / 2, s, s);
    } else {
      const s = cell * 0.84; c.fillStyle = i % 2 ? sk.c1 : sk.c2;
      c.strokeStyle = 'rgba(61, 240, 255, 0.8)'; c.lineWidth = 1.5;
      c.beginPath(); c.roundRect(x - s / 2, y - s / 2, s, s, cell * 0.2); c.fill(); c.stroke();
    }
  }
  
  c.shadowBlur = 0; const [hx, hy] = P[0], d = g.dir, px = -d.y, py = d.x;
  if (sk.id == 'pixel') { c.fillStyle = sk.c2; for (const s of [-1, 1]) c.fillRect(hx - d.x * r * 0.6 + px * r * 0.8 * s - r * 0.15, hy - d.y * r * 0.6 + py * r * 0.8 * s - r * 0.15, r * 0.3, r * 0.3); }
  if (sk.id == 'mecha') { c.fillStyle = '#2a3350'; c.beginPath(); c.roundRect(hx - r * 0.9, hy - r * 0.9, r * 1.8, r * 1.8, cell * 0.25); c.fill(); }
  
  for (const s of [-1, 1]) {
    const ex = hx + d.x * r * 0.35 + px * r * 0.45 * s, ey = hy + d.y * r * 0.35 + py * r * 0.45 * s;
    c.fillStyle = sk.e; c.shadowColor = sk.e; c.shadowBlur = 10;
    c.beginPath(); c.arc(ex, ey, r * 0.26, 0, 6.29); c.fill();
    if (sk.id != 'mecha') { c.shadowBlur = 0; c.fillStyle = '#111'; c.beginPath(); c.arc(ex + d.x * r * 0.08, ey + d.y * r * 0.08, r * 0.12, 0, 6.29); c.fill(); }
  }
  c.restore(); c.save(); c.lineWidth = 2;
  
  if (F.shield) { c.strokeStyle = '#3df0ff'; c.shadowColor = '#3df0ff'; c.shadowBlur = 18; c.beginPath(); c.arc(hx, hy, r * 1.35 + Math.sin(g.t / 100) * 2, 0, 6.29); c.stroke(); }
  if (F.mag > 0) { c.strokeStyle = 'rgba(61, 139, 255, 0.6)'; c.setLineDash([4, 8]); c.lineDashOffset = -g.t / 30; c.beginPath(); c.arc(hx, hy, cell * 3.5, 0, 6.29); c.stroke(); }
  c.restore();
}

function drawItems(g) {
  for (const it of g.items) {
    const x = ox + (it.x + 0.5) * cell, y = oy + (it.y + 0.5) * cell, r = cell / 2; c.save();
    if (it.type == 'food') {
      const p = 1 + 0.15 * Math.sin(g.t / 120 + it.x);
      c.fillStyle = '#ff3d81'; c.shadowColor = '#ff3d81'; c.shadowBlur = 20;
      c.beginPath(); c.arc(x, y, r * 0.6 * p, 0, 6.29); c.fill();
    } else if (it.type == 'coin') {
      if (it.ttl < 2500 && (g.t / 100 | 0) % 2) { c.restore(); continue; }
      c.fillStyle = '#ffc83d'; c.shadowColor = '#ffc83d'; c.shadowBlur = 15;
      c.beginPath(); c.ellipse(x, y, Math.max(2, r * 0.65 * Math.abs(Math.cos(g.t / 200))), r * 0.65, 0, 0, 6.29); c.fill();
    } else {
      if (it.ttl < 2500 && (g.t / 100 | 0) % 2) { c.restore(); continue; }
      const m = PW[it.type]; c.fillStyle = m.c + '33'; c.strokeStyle = m.c; c.lineWidth = 2; c.shadowColor = m.c; c.shadowBlur = 15;
      c.beginPath(); c.arc(x, y, r * 0.95, 0, 6.29); c.fill(); c.stroke(); c.shadowBlur = 0;
      c.beginPath(); c.arc(x, y, r * 1.15, -1.57, -1.57 + 6.28 * it.ttl / it.max); c.stroke();
      c.font = `${cell * 0.7}px serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(m.e, x, y + 2);
    }
    c.restore();
  }
}

function draw(dt) {
  c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, H);
  const g = G, F = g && g.fx, ov = g && F.over > 0, gh = g && F.ghost > 0, aw = cols * cell, ah = rows * cell; c.save();
  
  if (g && g.shake > 0.3) c.translate((Math.random() - 0.5) * g.shake, (Math.random() - 0.5) * g.shake);
  
  // Arena Background
  c.fillStyle = ov ? 'rgba(28, 22, 6, 0.8)' : 'rgba(11, 11, 34, 0.7)';
  c.fillRect(ox, oy, aw, ah);
  
  // Arena Grid
  c.strokeStyle = ov ? 'rgba(255, 200, 60, 0.15)' : 'rgba(61, 240, 255, 0.08)'; c.lineWidth = 1; c.beginPath();
  for (let i = 0; i <= cols; i++) { c.moveTo(ox + i * cell, oy); c.lineTo(ox + i * cell, oy + ah); }
  for (let j = 0; j <= rows; j++) { c.moveTo(ox, oy + j * cell); c.lineTo(ox + aw, oy + j * cell); }
  c.stroke();
  
  // Arena Borders
  c.strokeStyle = gh ? '#c89bff' : (ov ? '#ffc83d' : '#3df0ff'); c.lineWidth = 2; c.setLineDash(gh ? [10, 10] : []);
  c.shadowColor = c.strokeStyle; c.shadowBlur = 20; c.strokeRect(ox, oy, aw, ah); c.setLineDash([]); c.shadowBlur = 0;
  
  if (g) {
    drawItems(g); drawSnake(g);
    for (const p of g.parts) {
      c.globalAlpha = Math.max(0, p.life / p.max); c.fillStyle = p.c; c.shadowColor = p.c; c.shadowBlur = 8;
      c.fillRect(ox + p.x * cell - p.s / 2, oy + p.y * cell - p.s / 2, p.s, p.s);
    }
    c.globalAlpha = 1;
  }
  c.restore(); if (g && state == 'play') hud(g);
}

let fxKey = '';
function hud(g) {
  const F = g.fx;
  $('#sc').textContent = g.score; $('#co').textContent = '🪙 ' + (S.coins + g.coins);
  $('#sta').style.width = g.stam + '%';
  const k = ['mag', 'ghost', 'over'].map(n => F[n] > 0 ? Math.ceil(F[n] / 1000) : 0).join() + F.shield;
  if (k != fxKey) {
    fxKey = k;
    $('#fx').innerHTML = ['mag', 'ghost', 'over'].filter(n => F[n] > 0).map(n => `<span class="chip">${PW[n].e} ${Math.ceil(F[n] / 1000)}s</span>`).join('') + (F.shield ? '<span class="chip">🛡️</span>' : '');
  }
}

function frame(ts) {
  requestAnimationFrame(frame); let dt = Math.min(ts - last, 50); last = ts; if (!(dt > 0)) dt = 16;
  if (G && !paused) {
    if (G.freeze > 0) { G.freeze -= dt; dt = 0; }
    if (G.alive && state == 'play') update(G, dt);
    G.shake *= Math.exp(-dt / 80); // Smoother shake damping
    
    // Physics update with friction
    for (const p of G.parts) {
      p.vx *= 0.94; p.vy *= 0.94; // Friction
      p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000; p.life -= dt;
    }
    G.parts = G.parts.filter(p => p.life > 0);
  }
  draw(paused ? 0 : dt);
}
requestAnimationFrame(frame);

/* ---------- INTRO ANIMATION ---------- */
(function(){
  const cv = $('#ic'), x = cv.getContext('2d'), d = Math.min(devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight, port = h > w, L = port ? h : w, Wd = port ? w : h, T = 3200, N = 80, du = 0.005, R = Math.max(10, Math.min(w, h) * 0.035);
  cv.width = w * d; cv.height = h * d; x.scale(d, d); let fin = false; const t0 = performance.now();
  const pos = u => { const m = -0.1 * L + u * 1.2 * L, v = Wd / 2 + Math.sin(u * Math.PI * 5) * Wd * 0.3 + Math.sin(u * Math.PI * 12) * Wd * 0.04; return port ? [v, m] : [m, v]; };
  const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
  function end() { if (fin) return; fin = true; $('#intro').classList.add('out'); home(); setTimeout(() => $('#intro').remove(), 800); }
  $('#intro').onclick = end;
  
  function f(now) {
    if (fin) return; const e = now - t0, hu = ease(Math.min(1, e / T)) * 1.2;
    x.clearRect(0, 0, w, h);
    const hp = pos(hu), hm = port ? hp[1] : hp[0], fs = Math.min(w * 0.18, 100);
    x.save(); x.beginPath(); port ? x.rect(0, 0, w, hm) : x.rect(0, 0, hm, h); x.clip();
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `italic 900 ${fs}px "Orbitron", sans-serif`; x.fillStyle = '#39ff9c'; x.shadowColor = '#39ff9c'; x.shadowBlur = 40; x.fillText('SNAKE', w / 2, h / 2 - fs * 0.4);
    x.font = `italic 900 ${fs * 0.5}px "Orbitron", sans-serif`; 
    const gr = x.createLinearGradient(w / 2 - fs * 1.5, 0, w / 2 + fs * 1.5, 0); gr.addColorStop(0, '#ffc83d'); gr.addColorStop(1, '#ff3d81');
    x.fillStyle = gr; x.shadowColor = '#ff3d81'; x.fillText('OVERCHARGE', w / 2, h / 2 + fs * 0.4); x.restore();
    
    for (let i = N; i >= 0; i--) {
      const p = pos(hu - i * du), k = i / N;
      x.fillStyle = `hsl(${150 + k * 50}, 100%, ${60 - k * 18}%)`; x.shadowColor = '#39ff9c'; x.shadowBlur = 20;
      x.beginPath(); x.arc(p[0], p[1], R * (1 - 0.5 * k), 0, 6.29); x.fill();
    }
    x.shadowBlur = 0; const q = pos(hu + 0.003), dx = q[0] - hp[0], dy = q[1] - hp[1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
    if ((now / 100 | 0) % 2) { x.strokeStyle = '#ff3d4d'; x.lineWidth = 4; x.beginPath(); x.moveTo(hp[0] + ux * R, hp[1] + uy * R); x.lineTo(hp[0] + ux * R * 2.5, hp[1] + uy * R * 2.5); x.stroke(); }
    for (const s of [-1, 1]) {
      const ex = hp[0] + ux * R * 0.4 - uy * R * 0.5 * s, ey = hp[1] + uy * R * 0.4 + ux * R * 0.5 * s;
      x.fillStyle = '#fff'; x.beginPath(); x.arc(ex, ey, R * 0.3, 0, 6.29); x.fill();
      x.fillStyle = '#111'; x.beginPath(); x.arc(ex + ux * R * 0.1, ey + uy * R * 0.1, R * 0.15, 0, 6.29); x.fill();
    }
    if (e > T + 600) return end(); requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
})();

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
